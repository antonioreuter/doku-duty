name: doku-lite
version: 1
description: >
  Lightweight three-artifact workflow for a single-developer project.
  Proposal folds in the technical notes that spec-driven puts in design.md.
  Specs remain so that archive keeps building durable truth under
  openspec/specs/; skip them per change with skip_specs when a change has no
  observable behaviour.

# ---------------------------------------------------------------------------
# Skills available to this workflow
#
# Two kinds, and the difference matters. Getting it wrong means an instruction
# that silently does nothing.
#
#   Agent-invocable — call with the Skill tool, fully-qualified:
#     mattpocock-skills:grilling          interview to settle open decisions
#     mattpocock-skills:research          verify external API facts from docs
#     mattpocock-skills:domain-modeling   glossary and ADR discipline
#     mattpocock-skills:codebase-design   weigh a structural or dependency call
#     mattpocock-skills:tdd               failing test first, then implementation
#     mattpocock-skills:diagnosing-bugs   systematic fault isolation
#     mattpocock-skills:code-review       review a diff before archive
#
#   User-only — marked disable-model-invocation, so the agent CANNOT call them.
#   Recommend them and stop; never claim to have run one:
#     /grill-with-docs   grilling + domain-modeling, persisting to disk
#     /to-spec           turn a finished grilling session into a spec
#     /to-tickets        turn a spec into tickets
#
# Known trap: /grill-with-docs writes its files only when run on its own. Its
# own documentation records that running it nested inside another orchestration
# layer — a spec-driven wrapper such as this one — still runs the interview but
# silently skips the file writes. So it is always a separate step the developer
# runs BEFORE a change is created, never a step inside it.
#
# House rule when it does run: it defaults to CONTEXT.md and docs/adr/, both of
# which this project forbids. Redirect its output — glossary terms go to
# openspec/project.md, decisions go to DECISIONS.md as the next D-NN with a
# rationale paragraph. Same for mattpocock-skills:domain-modeling.
# ---------------------------------------------------------------------------

artifacts:
  - id: proposal
    generates: proposal.md
    description: Why, what, technical notes, and what is out of scope
    template: proposal.md
    requires: []
    instruction: |
      Write a short proposal. Aim for one screen, not a document.

      Cover, in this order:
      - Why now, in two or three sentences
      - What changes, as a list
      - Which of the ten constraints it touches and how it stays within them
      - Technical notes: answer only the three questions in the template, and
        only where they apply
      - Not doing

      Do not restate settled decisions. Cite the D-NN id from DECISIONS.md.

      Skills:

      - Unresolved decisions. If the idea still has open decisions, do not
        guess them into the proposal. Invoke mattpocock-skills:grilling and
        work the frontier with the developer until the decisions that would
        change scope are settled. Fold the answers in, then cite any that
        belong in DECISIONS.md as a new D-NN.

      - Vocabulary or a decision worth keeping. When the session would produce
        a new glossary term or a decision that is hard to reverse, surprising
        without context, and a genuine trade-off, stop and recommend the
        developer run /grill-with-docs as its own session before this change is
        created. You cannot invoke it. Say plainly that it needs to run
        standalone, because nested inside this workflow it interviews but
        writes nothing — and that its output must land in openspec/project.md
        and DECISIONS.md, not the CONTEXT.md and docs/adr/ it defaults to.

      - External API facts. The stack leans on Rive, Drift, RevenueCat,
        AppLovin MAX with AdMob as a demand source, AWS (Cognito, DynamoDB,
        S3 behind CloudFront), and Sentry. docs/TECH_STACK.md is canonical for
        that list and §7 names the entries most likely to have moved. Never
        assert what one of those does from memory in Technical notes. Invoke
        mattpocock-skills:research and cite what it finds. An unverified claim
        about a dependency is the most expensive kind of error to make here,
        because it survives into tasks unchallenged.

        Version numbers are part of this. Confirm them at implementation time
        rather than trusting the proposal: the latest release is not always the
        one that resolves, and on this project the newest Drift produced an app
        that could not open its database on Android at all (D-77).

      - A dependency that passes on the test host can still be broken on a
        device. Native code is the case that matters: the test host links the
        machine's own libraries, so a library that never reaches the APK or the
        IPA is invisible to every unit test. When a change adds or moves one,
        the proposal says how it will be verified on a device, and the tasks
        carry that check.

      - New dependency. Before answering the template's "New dependency"
        question with anything other than "none", invoke
        mattpocock-skills:codebase-design to weigh it against what is already
        in the stack. The template asks why an existing one will not do; that
        answer has to be argued, not asserted.

  - id: specs
    generates: "specs/**/*.md"
    description: Delta specs — ADDED / MODIFIED / REMOVED requirements
    template: specs.md
    requires:
      - proposal
    instruction: |
      Write delta requirements only for behaviour a user or another capability
      can observe. Internal refactors need no requirements.

      Each requirement uses "The system MUST ..." and carries at least one
      WHEN/THEN scenario. Use glossary terms from openspec/project.md exactly.

      Add a scenario for the offline case whenever the change touches network,
      and for the non-punitive default wherever a penalty could be inferred.

      If nothing observable changes, set skip_specs in .openspec.yaml rather
      than writing empty requirements.

      Skills:

      - Glossary drift is the failure mode here. If this change needs a word
        that openspec/project.md does not define, or uses an existing term in
        a way its definition does not cover, invoke
        mattpocock-skills:domain-modeling and settle the term before writing
        the requirement. Add it to the glossary in openspec/project.md in the
        same pass — never to a CONTEXT.md, which this project forbids. A spec
        built on an undefined word cannot be reviewed against anything.

      - If the developer already ran a grilling session for this change, its
        answers are the source material. Re-read them from disk rather than
        from conversation memory, and say so if a precise answer from that
        session (an ordering guarantee, a numeric default, a negative
        requirement) does not survive into a requirement. Softening a precise
        answer into weaker prose is the known way this step fails. The
        developer can also run /to-spec themselves against that session; you
        cannot invoke it.

  - id: tasks
    generates: tasks.md
    description: Implementation checklist
    template: tasks.md
    requires:
      - proposal
    instruction: |
      Atomic, independently verifiable tasks. One file or one coherent unit of
      behaviour each. Order them so the app stays runnable after every task.

      Interleave tests with implementation rather than grouping them at the end.
      For pure-logic capabilities write the failing test task before the
      implementation task that satisfies it.

      Add an explicit iOS check and an Android check for anything touching
      platform behaviour, and an accessibility task wherever colour, motion, or
      haptics are involved.

      Skills:

      - Invoke mattpocock-skills:tdd to shape the ordering for the load-bearing
        pure-logic systems. Take the list from the project rules rather than
        from memory — the rules define it canonically, and this instruction
        deliberately does not restate it, because a second copy is how the two
        lists disagreed before.

      - Keep tasks in tasks.md. Do not invoke /to-tickets — you cannot, and its
        output is a parallel ticket list that would compete with this file as
        the source of truth. Mention it only if the developer asks for tickets.

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Work top to bottom. Mark each checkbox the moment its task is done, not in
    a batch at the end — a solo project has no one else to reconstruct where
    you stopped.

    Skills:

    - Implementing a test-first task from any of the load-bearing pure-logic
      systems the project rules name: invoke mattpocock-skills:tdd and let the
      failing test drive the shape. Read the list from the rules, not memory.

    - Stuck on a defect for more than one attempt: stop guessing and invoke
      mattpocock-skills:diagnosing-bugs. Repeated speculative edits to the grid
      renderer or the notes model are how input latency and note persistence
      regress without anyone noticing which change did it.

    - Before the change is archived: invoke mattpocock-skills:code-review over
      the diff. Check it against the ten constraints specifically, not just for
      general quality — constraint 7 (ad removal is absolute) and constraint 2
      (input latency under 100ms) are release blockers and are not visible from
      a diff unless someone is looking for them.

    - When an implementation detail contradicts a spec, stop and ask. Change the
      spec deliberately; do not let the code quietly become the spec.
