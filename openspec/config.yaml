schema: doku-lite

context: |
  Doku Duty — a free-to-play sudoku game for iOS and Android, built in Flutter
  from a single codebase. Comedic frontier setting: the player is a deputy who
  files numbers for a living, rising from Greenhorn to Legend.

  Single developer. Keep artifacts short. A proposal is one screen, not a
  document. Prefer deciding and moving on over exhaustive documentation, but
  never at the cost of the constraints below.

  Reference material, do not restate it:
  - docs/IDEA.md — product description
  - docs/doku-duty-game-bible.md — mechanism, rules, objectives, and narrative
    in one place: the note model, the six-rank technique ladder, the three
    progression layers, the per-event motion/haptic/sound table, and what the
    game refuses to do. Read this before proposing anything that touches play,
    progression, or effects. It is compiled from the sources below, so cite the
    D-NN it carries rather than the bible itself when recording a rationale.
  - docs/DECISIONS.md — 68 numbered decisions with rationale, cited as D-NN
  - docs/TECH_STACK.md — the decided stack and the reasoning behind it: client,
    AWS backend, auth and the guest tier, purchases and commission, offline and
    sync merge semantics, and build-time tooling. Canonical for anything
    technology-related; openspec/project.md defers to it. Read §7 before writing
    a proposal that depends on a third-party choice — four of them move, and the
    document says so.
  - openspec/project.md — conventions and glossary (the stack table now defers
    to docs/TECH_STACK.md)
  - openspec/BACKLOG.md — ordered change list with dependencies

  The ten constraints. These are settled and not open to reinterpretation.
  This list is canonical — openspec/project.md defers to it rather than
  restating it, so it cannot drift.

  1. Non-punitive. No lives, hearts, energy, session limits, or failure states.
     No timer can fail a puzzle. Auto-check off by default; mistake limits only
     in opt-in strict mode.
  2. Input latency under 100ms. No animation ever blocks the next tap. No
     in-puzzle effect exceeds 400ms, and every effect is skippable.
  3. Nine candidates per cell, in fixed positions. 1 top-left, 5 centre,
     9 bottom-right, always. Adding or removing a candidate never moves the
     others.
  4. One colour, one job. The palette is eight tokens: six carry state — ink,
     focus, candidate, provisional, error, completion — and two are surfaces
     (D-71). Decoration draws from that set and never adds a ninth. Pale tints,
     depth shades, and on-colour text values derive from one of the eight and
     are not a route around the count. Season themes repaint surfaces only —
     the state colours themselves are fixed.
  5. Colour is never the sole signal for any state. Completion carries a corner
     mark; notes carry position; errors carry character animation.
  6. No ad ever interrupts a grid in progress. Interstitials fire only after a
     node completes, after the celebration, and after an explicit tap.
  7. Ad removal is absolute, verified by automated test on every release. This
     is a release blocker, not a support ticket category.
  8. Every puzzle has exactly one solution and is solvable by logic alone at
     every rank. No guess-and-check.
  9. Note state is written on every change, never on a timer. This is the
     constraint that protects saved games; a plausible-looking change to notes
     logic can violate it without any visible symptom.
  10. No purchasable currency and no gacha. Stamps are a perk currency earned
      in play only (D-66) and can never be bought at any price — no coin store,
      no bundles. Running out of Stamps never blocks play (D-67).

  Both platforms are first-class. Nothing is complete until it works on iOS and
  Android, including haptics, safe areas, and store behaviour. Full offline
  play is mandatory: network is required only for ads, cloud save,
  leaderboards, and pack top-ups, and every one of those degrades gracefully.

  Working alongside mattpocock/skills:
  - Domain context goes in openspec/project.md. Never create CONTEXT.md.
  - Decisions go in docs/DECISIONS.md as the next D-NN entry, with a rationale
    paragraph. Never create an adr/ directory.
  - Requirements live only in openspec/specs/ and change deltas.

  Ubiquitous language. The glossary in openspec/project.md is canonical: node,
  season, rank, unit, settled note, provisional note, auto-cleanup, cabinet,
  strict mode, stamp, perk, digit sweep, guest, signed in. Use these terms in proposals, specs, tasks, code identifiers,
  and test names. Never "box" for unit, "level" for node or rank, "pencil mark"
  for note, "difficulty" where rank is meant, or "coin"/"gem"/"token" for stamp. A change needing a new concept
  adds it to the glossary in the same change.

rules:
  proposal:
    - >-
      One screen. Cite D-NN ids rather than re-arguing.
    - >-
      Always include the "Not doing" section — scope creep is the delivery risk.
    - >-
      Recommend a grilling session instead of writing the proposal if decisions
      are still open.

  specs:
    - >-
      Observable behaviour only. Skip the artifact entirely for internal work.
    - >-
      Glossary terms exactly as written in project.md.

  tasks:
    - >-
      Atomic and independently verifiable. Tests interleaved, not appended.
    - >-
      Test-first is required for the load-bearing pure-logic systems, and this
      is the canonical list — the puzzle engine including generation and
      grading, all notes logic (settled notes, provisional notes, and
      auto-cleanup), the mistake model, and rank progression. These carry no
      Flutter import, so there is no excuse for leaving them untested, and a
      silent bug in any of them corrupts saved player progress.

operations:
  apply:
    guidance:
      - >-
        When the session grows long, stop and tell the developer to run
        /handoff pointed at the change directory. You cannot invoke it —
        it is marked disable-model-invocation.
      - >-
        Before changing anything in the puzzle engine or notes logic, invoke
        mattpocock-skills:diagnosing-bugs rather than editing speculatively. A
        plausible-looking fix there can silently corrupt saved games, and
        constraint 9 has no visible symptom when it breaks.
      - >-
        A task is done when its test passes on both platforms, not when it
        compiles.

  archive:
    guidance:
      - >-
        Confirm every task in tasks.md is checked and the delta specs still
        describe what was actually built. Where the code and the spec diverged,
        update the delta first so the main spec under openspec/specs/ inherits
        the truth rather than the intention.
      - >-
        Check the change against the ten constraints one last time before
        folding it in. Constraint 7 (ad removal is absolute) and constraint 9
        (note state written on every change) are the two that pass review
        unnoticed, because neither shows a symptom in the diff.
      - >-
        Record any deliberate deviation from the proposal as the next D-NN
        entry in docs/DECISIONS.md with its rationale, so the reason outlives the
        archived change.
      - >-
        If the change introduced a glossary term, verify it landed in
        openspec/project.md before archiving.
